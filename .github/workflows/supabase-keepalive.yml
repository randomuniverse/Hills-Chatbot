name: Keep Supabase awake

on:
  schedule:
    # Every 4 days at 03:17 UTC, safely inside Supabase's inactivity window.
    - cron: "17 3 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Replit app and ping Supabase
        run: |
          curl --fail-with-body \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            "https://asset-manager-rndmunvs.replit.app/api/keepalive"
